name: gaming_engagement
version: "0.5.0"
config-version: 2

profile: gaming_engagement

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  gaming_engagement:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  gaming_engagement:
    +schema: raw
    raw_users:
      +column_types:
        user_id: varchar
    raw_servers:
      +column_types:
        server_id: varchar
        owner_user_id: varchar
