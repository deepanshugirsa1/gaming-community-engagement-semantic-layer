# BigQuery profile — copy to ~/.dbt/profiles.yml and fill in your values.
# The same models run unchanged on BigQuery; only this profile differs.
gaming_engagement:
  target: bigquery
  outputs:
    bigquery:
      type: bigquery
      method: service-account
      project: your-gcp-project-id
      dataset: gaming_engagement
      keyfile: /path/to/service-account.json
      location: US
      threads: 4
      priority: interactive
